# Deploy frontend RASA ke GitHub Pages (https://<user>.github.io/rasa-restaurant-os/)
# Hanya file frontend yang dipublikasikan: index.html, app.js, style.css, core/*.
# Backend (server/*, wrangler.jsonc, D1) TIDAK ikut — API tetap dilayani
# Cloudflare Worker, dan core/api.js mengarahkan '/api/*' ke sana.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Kumpulkan file frontend
        shell: bash
        run: |
          mkdir -p _site
          cp index.html app.js style.css _site/
          cp -R core _site/core
          : > _site/.nojekyll
          echo "File yang dipublikasikan:"
          find _site -type f | sort

      - name: Unggah artefak Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
